name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
          cache-provider: basic

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd PixelControlCenter
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Show Gradle error in job summary
        if: failure()
        shell: bash
        run: |
          {
            echo '## Gradle failure'
            echo '~~~'
            echo '--- compiler / resource errors ---'
            grep -E '^e: |error:|AAPT:' "$RUNNER_TEMP/gradle.log" | head -40 || true
            echo '--- what went wrong ---'
            sed -n '/^FAILURE:/,/^\* Exception is:/p' "$RUNNER_TEMP/gradle.log" | head -60
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: PixelControlCenter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-reports
          path: PixelControlCenter/app/build/reports
          if-no-files-found: ignore
          retention-days: 7
